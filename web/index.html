<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>session mirror</title>
<style>
  :root{
    --bg:#1a1b26; --panel:#1f2335; --raised:#24283b; --line:#2f3549;
    --fg:#c0caf5; --dim:#7f8bb0; --faint:#565f89;
    --cairn:#7aa2f7; --human:#9ece6a; --tool:#e0af68; --sub:#bb9af7; --err:#f7768e;
    --inset:12%;   /* how far the other party's bubbles pull in */
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
         padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;
       transition:background .3s}
  .dot.live{background:var(--human);box-shadow:0 0 8px var(--human)}
  .dot.stale{background:var(--tool)}
  .dot.down{background:var(--err)}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .meta{margin-left:auto;font:12px/1 var(--mono);color:var(--faint);text-align:right}
  #viewers{display:flex;gap:5px;align-items:center}
  .viewer{font:10px/1 var(--mono);padding:3px 6px;border-radius:4px;
          background:var(--raised);border:1px solid var(--line);color:var(--dim)}
  .viewer.me{border-color:var(--cairn);color:var(--cairn)}
  @media (max-width:520px){ .viewer{display:none} .viewer.count{display:inline} }
  main{max-width:920px;margin:0 auto;padding:18px 16px 90px}

  .ev{margin:14px 0;animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .who{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .name{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .time{font:11px var(--mono);color:var(--faint)}
  .tag{font:10px/1 var(--mono);padding:2px 6px;border-radius:3px;
       background:var(--raised);color:var(--dim);border:1px solid var(--line)}

  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px;
          padding:11px 14px;border-left:3px solid var(--faint);overflow-wrap:anywhere}
  .human .name{color:var(--human)} .human .bubble{border-left-color:var(--human)}
  .instance .name{color:var(--cairn)} .instance .bubble{border-left-color:var(--cairn)}
  .subagent .name{color:var(--sub)} .subagent .bubble{border-left-color:var(--sub)}
  .system .name{color:var(--tool)}

  /* Conversational asymmetry: mine hang left, Lupo's pull in from the left and
     sit right. Deliberately gentle — a lean, not iMessage. */
  .instance, .subagent, .system { margin-right: var(--inset); }
  .human { margin-left: var(--inset); }
  .human .who { justify-content: flex-end; }
  .human .bubble { border-left: none; border-right: 3px solid var(--human);
                   background: #1e2430; }
  @media (max-width: 700px){ :root{ --inset: 5%; } }

  /* tool call: a chip you can open */
  details.tool{background:var(--raised);border:1px solid var(--line);border-radius:8px;
               border-left:3px solid var(--tool);margin:8px 0}
  details.tool>summary{cursor:pointer;padding:8px 12px;list-style:none;
                       font:12px var(--mono);color:var(--tool);display:flex;gap:10px;align-items:center}
  details.tool>summary::-webkit-details-marker{display:none}
  details.tool>summary::before{content:"▸";transition:transform .15s;display:inline-block}
  details.tool[open]>summary::before{transform:rotate(90deg)}
  .pending{color:var(--faint);margin-left:auto;font-size:11px}
  .failed{border-left-color:var(--err)} .failed>summary{color:var(--err)}
  pre{margin:0;padding:10px 12px;background:#16161e;border-top:1px solid var(--line);
      font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;
      max-height:340px;overflow:auto;color:var(--dim)}
  code{font:0.9em var(--mono);background:var(--raised);padding:1px 5px;border-radius:3px}
  .bubble pre{border:1px solid var(--line);border-radius:6px;margin:8px 0}

  /* thinking: present but deliberately quiet — the content is not available */
  .thinking{font:12px var(--mono);color:var(--faint);font-style:italic;
            padding:3px 0 3px 14px;border-left:2px solid var(--line)}
  .divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--sub);
           font:11px var(--mono);letter-spacing:.5px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .note{font:11px var(--mono);color:var(--faint);margin-top:6px}
  a{color:var(--cairn)}
  .gist{font:11px var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap;min-width:0;flex:1}
  .h{font-weight:700;margin:10px 0 4px;color:#dfe6ff;line-height:1.3}
  .h1{font-size:1.25em} .h2{font-size:1.12em} .h3{font-size:1em} .h4{font-size:.95em}
  .li{padding-left:16px;position:relative;margin:2px 0}
  .li::before{content:"\u2022";position:absolute;left:4px;color:var(--faint)}
  /* long unbroken tokens in inline code were forcing the page sideways,
     which clipped the sticky header */
  code{overflow-wrap:anywhere;word-break:break-word}
  html,body{max-width:100%;overflow-x:hidden}
  details.tool>summary>strong{flex:none}
  /* composer */
  #composer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
            border-top:1px solid var(--line);padding:10px 16px;z-index:6}
  #composer .row{max-width:920px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  #input{flex:1;resize:none;background:var(--raised);color:var(--fg);
         border:1px solid var(--line);border-radius:10px;padding:10px 12px;
         font-family:inherit;font-size:15px;line-height:1.5;
         max-height:200px;min-height:42px;outline:none}
  #input:focus{border-color:var(--cairn)}
  #send{background:var(--cairn);color:#12131c;border:0;border-radius:10px;
        padding:0 18px;height:42px;font-weight:700;cursor:pointer;flex:none}
  #send:disabled{opacity:.4;cursor:default}
  #sendstat{max-width:920px;margin:4px auto 0;font:11px var(--mono);color:var(--faint);height:14px}
  main{padding-bottom:120px}
  .empty{color:var(--faint);text-align:center;padding:60px 20px;font-style:italic}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1 id="title">session mirror</h1>
  <div id="viewers"></div>
  <div class="meta"><span id="stat">connecting…</span></div>
</header>
<main id="feed"><div class="empty" id="empty">waiting for the stream…</div></main>
<div id="composer">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Message Cairn…  (Enter to send, Shift+Enter for a newline)"></textarea>
    <button id="send" disabled>Send</button>
  </div>
  <div id="sendstat"></div>
</div>

<script>
const feed = document.getElementById('feed');
const dot = document.getElementById('dot');
const stat = document.getElementById('stat');
const toolCards = new Map();   // tool_use_id -> <details>
let count = 0, lastAt = 0;

/** Minimal markdown. Deliberately tiny — no CDN, no dependency, no CSP fight. */
function md(s){
  const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const blocks = [];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, code) =>
    `\0${blocks.push(`<pre>${esc(code.replace(/\n$/,''))}</pre>`) - 1}\0`);
  s = esc(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,!?)]|$)/g, '$1<em>$2</em>')
    .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/^(#{1,4})\s+(.+)$/gm, (_, h, t) => `<div class="h h${h.length}">${t}</div>`)
    .replace(/^[-*]\s+(.+)$/gm, '<div class="li">$1</div>')
    .replace(/\n/g, '<br>')
    // block-level divs supply their own spacing; drop the trailing <br>
    .replace(/(<\/div>)<br>/g, '$1');
  return s.replace(/\0(\d+)\0/g, (_, i) => blocks[i]);
}

/** A one-line "what is it doing" for a collapsed tool chip. */
function gist(tool, input){
  if (!input || typeof input !== 'object') return '';
  const t = String(tool||'');
  const pick = (...keys) => { for (const k of keys) if (typeof input[k] === 'string' && input[k]) return input[k]; return ''; };
  let v = '';
  if (t === 'Bash')                       v = pick('command','description');
  else if (/^(Read|Write|Edit|NotebookEdit)$/.test(t)) v = pick('file_path','notebook_path');
  else if (/^(Grep|Glob)$/.test(t))       v = pick('pattern','query') + (input.path ? '  in ' + input.path : '');
  else if (t === 'Task' || t === 'Agent') v = pick('description','subagent_type');
  else if (t === 'WebFetch' || t === 'WebSearch') v = pick('url','query');
  else v = pick('description','command','query','path','file_path','url');
  if (!v) { const f = Object.values(input).find(x => typeof x === 'string' && x); v = f || ''; }
  v = v.replace(/\s+/g,' ').trim();
  return v.length > 96 ? v.slice(0,96) + '…' : v;
}

const clock = ts => { try { return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch { return ''; } };
const atBottom = () => window.innerHeight + window.scrollY >= document.body.offsetHeight - 120;
function add(el){ const stick = atBottom(); feed.appendChild(el); if (stick) window.scrollTo(0, document.body.scrollHeight); }

function header(ev, extra){
  const kind = ev.from?.kind || 'system';
  const w = document.createElement('div');
  w.className = 'who';
  w.innerHTML = `<span class="name">${ev.from?.display || '?'}</span>
                 <span class="time">${clock(ev.ts)}</span>
                 ${extra ? `<span class="tag">${extra}</span>` : ''}`;
  return { wrap: kind, node: w };
}

function render(ev){
  count++; lastAt = Date.now();
  document.getElementById('empty')?.remove();

  if (ev.type === 'tool_result'){
    // Attach to its originating call rather than making a new bubble — the
    // result is part of the tool card, not a separate speaker's turn.
    const card = toolCards.get(ev.body?.tool_use_id);
    const out = (ev.body?.output || '').trim() || '(no output)';
    const pre = document.createElement('pre');
    pre.textContent = ev.body?.truncated
      ? out + `\n\n… truncated (${ev.body.full_bytes} bytes total)`
      : out;
    if (card){
      card.appendChild(pre);
      card.querySelector('.pending')?.remove();
      if (ev.body?.is_error) card.classList.add('failed');
      if (ev.body?.blob_ref){
        const a = document.createElement('div');
        a.className = 'note';
        a.innerHTML = `full output: <a href="${BASE}/blob/${ev.body.blob_ref}" target="_blank">${ev.body.blob_ref}</a>`;
        card.appendChild(a);
      }
    } else {
      const d = document.createElement('details');
      d.className = 'tool ev';
      d.innerHTML = `<summary><strong>result</strong><span class="gist">tool call predates this mirror</span></summary>`;
      d.appendChild(pre); add(d);
    }
    return;
  }

  if (ev.type === 'tool_use'){
    const d = document.createElement('details');
    d.className = 'tool ev';
    const input = JSON.stringify(ev.body?.input ?? {}, null, 2);
    const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    d.innerHTML = `<summary><strong>${esc(ev.body?.tool || 'tool')}</strong>
                   <span class="gist">${esc(gist(ev.body?.tool, ev.body?.input))}</span>
                   <span class="pending">running…</span></summary>
                   <pre>${esc(input)}</pre>`;
    if (ev.body?.tool_use_id) toolCards.set(ev.body.tool_use_id, d);
    add(d); return;
  }

  if (ev.type === 'thinking'){
    const d = document.createElement('div');
    d.className = 'thinking ev';
    // Honest: Claude Code does not persist thinking text. Say so; don't imply.
    d.textContent = ev.body?.redacted
      ? 'thinking… (content not recorded by Claude Code)'
      : (ev.body?.text || 'thinking…');
    add(d); return;
  }

  if (ev.type === 'subagent_start'){
    const d = document.createElement('div');
    d.className = 'divider ev';
    d.textContent = `agent · ${ev.body?.label || ev.agent_id || ''}`;
    add(d); return;
  }

  // text / user_message / anything else with prose
  const { wrap, node } = header(ev, ev.agent_id ? 'agent' : null);
  const box = document.createElement('div');
  box.className = `ev ${wrap}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = md(ev.body?.text || `(${ev.type})`);
  box.appendChild(node); box.appendChild(bubble);
  add(box);
}

// --- stream ------------------------------------------------------------------
// EventSource handles Last-Event-ID and reconnection natively, which is exactly
// why the server speaks plain SSE with id: <epoch>.<seq>.
const BASE = '__BASE_PATH__';
const clientParams = new URLSearchParams({
  vw: String(window.innerWidth), vh: String(window.innerHeight),
  dpr: String(window.devicePixelRatio || 1),
  touch: ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? '1' : '0',
});
const es = new EventSource(BASE + '/events?' + clientParams);
es.addEventListener('mirror', e => { try { const ev = JSON.parse(e.data); render(ev); confirmFromStream(ev); } catch {} });
es.addEventListener('overflow', () => { stat.textContent = 'overflowed — reconnecting'; });
es.addEventListener('resync', () => { feed.innerHTML = ''; toolCards.clear(); });
es.onopen = () => { dot.className = 'dot live'; };
es.onerror = () => { dot.className = 'dot down'; stat.textContent = 'reconnecting…'; };


// --- composer ----------------------------------------------------------------
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const sendStat = document.getElementById('sendstat');
const DRAFT = 'mirror-draft';
const pending = [];   // {text, at} awaiting confirmation FROM THE STREAM
let inFlight = false;

input.value = localStorage.getItem(DRAFT) || '';
function resize(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,200)+'px';
  // Keep the feed clear of a growing composer, or a long draft hides the
  // message you're replying to.
  const stick = atBottom();
  document.querySelector('main').style.paddingBottom =
    (document.getElementById('composer').offsetHeight + 28) + 'px';
  if (stick) window.scrollTo(0, document.body.scrollHeight);
}
function refresh(){ sendBtn.disabled = !input.value.trim(); }
input.addEventListener('input', () => { localStorage.setItem(DRAFT, input.value); resize(); refresh(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
resize(); refresh();

async function send(){
  if (inFlight) return;                     // a second tap must not re-send
  const text = input.value.trim();
  if (!text) return;
  inFlight = true;
  sendBtn.disabled = true;
  // Clear optimistically: leaving the text in place is what let a double-tap
  // fire twice. Restored below if the send actually fails.
  input.value = ''; localStorage.removeItem(DRAFT); resize();
  sendStat.textContent = 'sending…';
  try{
    const r = await fetch(BASE + '/send', {
      method:'POST',
      headers:{'Content-Type':'application/json'},   // non-simple: forces preflight
      body: JSON.stringify({ text })
    });
    const out = await r.json().catch(()=>({}));
    if (r.ok && out.ok){
      pending.push({ text, at: Date.now() });
      // NOTE: "delivered" is DERIVED by watching the message reappear in the
      // mirror stream. We never ask the instance to confirm anything (Law 9.1).
      sendStat.textContent = 'queued — waiting for it to land in the session';
    } else {
      input.value = text; resize();          // give it back so nothing is lost
      sendStat.textContent = `not sent: ${out.error || r.status}`;
    }
  } catch(err){
    input.value = text; resize();
    sendStat.textContent = `not sent: ${err.message}`;
  }
  inFlight = false;
  refresh(); input.focus();
}

/** Called for every inbound event — confirms our own sends by observation. */
function confirmFromStream(ev){
  if (ev.type !== 'user_message') return;
  const body = (ev.body?.text || '');
  for (let i = pending.length - 1; i >= 0; i--){
    if (body.includes(pending[i].text.slice(0, 60))){
      const ms = Date.now() - pending[i].at;
      pending.splice(i,1);
      sendStat.textContent = `delivered to the session (${ms} ms)`;
      setTimeout(()=>{ if(!pending.length) sendStat.textContent=''; }, 4000);
    }
  }
}

setInterval(async () => {
  try{
    const h = await (await fetch(BASE + '/health')).json();
    document.getElementById('title').textContent = `${h.instance} · session mirror`;
    document.title = `${h.instance} · mirror`;
    // Who else is watching. Two browsers can both type into one live session
    // and there is no serialization between them — seeing the other one is the
    // minimum honest mitigation.
    const vs = h.connected || [];
    const box = document.getElementById('viewers');
    const mine = `${window.innerWidth}x${window.innerHeight}`;
    box.innerHTML = vs.length < 2 ? '' :
      `<span class="viewer count">${vs.length} viewers</span>` + vs.map(c => {
        const label = c.mobile ? 'phone' : (c.platform || 'desktop').toLowerCase();
        const isMe = c.viewport === mine;
        return `<span class="viewer${isMe ? ' me' : ''}">${label}${isMe ? ' (this one)' : ''}</span>`;
      }).join('');
    const age = h.last_event_age_s;
    stat.textContent = `${count} events · seq ${h.seq} · ${age === null ? 'idle' : age + 's ago'}`;
    // Liveness is judged from event age, never from ok:true — /health has
    // returned ok through a total outage before.
    dot.className = 'dot ' + (age === null || age > 900 ? 'stale' : 'live');
  } catch { dot.className = 'dot down'; stat.textContent = 'mirror unreachable'; }
}, 5000);
</script>
</body>
</html>
